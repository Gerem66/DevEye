# The commercial license of the core needs a single rights holder: no outside
# contribution merges before its author has signed CLA.md.
#
# pull_request_target runs with this repository's write token. Never check out
# or run the pull request's code in this workflow.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA
        if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/Gerem66/DevEye/blob/main/CLA.md'
          path-to-signatures: 'signatures/cla.json'
          # The action commits each signature here: a rule that covers this
          # branch would block it.
          branch: 'cla-signatures'
          allowlist: Gerem66,dependabot[bot]
