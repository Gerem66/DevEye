name: React App CD

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Clone submodules
        run: |
          git config --global credential.helper store
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git config --global github.token ${{ secrets.ACCESS_TOKEN }}
          git submodule update --init --recursive

      - name: Use Node.js 18.x
        uses: actions/setup-node@v2
        with:
          node-version: 18.x

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install lftp -y

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build to FTP prod server
        if: ${{ github.base_ref == 'master' }}
        run: lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate no; open -u ${{ secrets.FTP_PROD_USER }},${{ secrets.FTP_PROD_PASS }} ${{ secrets.FTP_PROD_HOST }} && mirror --reverse ./build/ /"

      - name: Upload files server to FTP prod server
        if: ${{ github.base_ref == 'master' }}
        run: lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate no; open -u ${{ secrets.FTP_PROD_USER }},${{ secrets.FTP_PROD_PASS }} ${{ secrets.FTP_PROD_HOST }} && mirror --reverse ./src/server/ /server"