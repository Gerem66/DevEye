name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # Server + client: lint, format, typecheck, tests, build (the `npm run ci` of each).
  web:
    name: server + client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Installs the server deps (brings @deveye/types into ./node_modules, which
      # the client also resolves by walking up the tree).
      - name: Install server deps
        run: npm ci

      - name: Server CI (lint + format + typecheck + tests, app only)
        run: npm run ci

      # Client has no lockfile; install then run its CI (lint + typecheck + build).
      - name: Install client deps
        working-directory: client
        run: npm install

      - name: Client CI (lint + typecheck + build)
        working-directory: client
        run: npm run ci

  # In-repo feature modules (features/*): their own lint, format, typecheck
  # and tests, apart from the app's — same split as ./ci.sh.
  features:
    name: features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Features CI (lint + format + typecheck + tests)
        run: npm run ci:features

  # Smoke E2E of every installed feature module: a real server on a fresh
  # MySQL, the built client, a real Chrome — the only guard for the bug class
  # nothing else sees (command registry, catalog, blank page). See
  # scripts/smoke-all.ts.
  smoke:
    name: smoke (features E2E)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: DevEye
          MYSQL_USER: deveye
          MYSQL_PASSWORD: deveye
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: dev
      LISTEN_PORT: 3999
      PUBLIC_ORIGIN: http://localhost:3999
      LOG_LEVEL: info
      DB_HOSTNAME: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: DevEye
      DB_USERNAME: deveye
      DB_PASSWORD: deveye
      # Throwaway secrets: the database is born and dies with the job.
      CRYPT_KEY_A: ci-smoke-crypt-key-a
      CRYPT_KEY_B: ci-smoke-crypt-key-b
      JWT_ACCESS_SECRET: ci-smoke-jwt-access
      JWT_REFRESH_SECRET: ci-smoke-jwt-refresh
      DEVICE_TOKEN_SECRET: ci-smoke-device-token
      SMOKE_BROWSER: google-chrome
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install server deps
        run: npm ci

      - name: Install client deps
        working-directory: client
        run: npm install

      - name: Smoke every installed module
        run: npm run ci:smoke

  # Agent: format + clippy + build on Linux (the per-OS binaries ship via
  # agent-build.yml on pushes to main).
  agent:
    name: agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v6

      # `dtolnay/rust-toolchain` appelle `rustup`, qui télécharge depuis
      # static.rust-lang.org SANS aucun réessai : un « Connection reset by peer »
      # d'une seconde suffit à faire échouer tout le job, alors que rien n'est
      # cassé. Le réessai est ici, autour de l'action elle-même.
      - name: Install Rust toolchain
        id: rust
        continue-on-error: true
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Rust toolchain (2e tentative)
        id: rust-retry
        if: steps.rust.outcome == 'failure'
        continue-on-error: true
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Rust toolchain (dernière tentative)
        if: steps.rust.outcome == 'failure' && steps.rust-retry.outcome == 'failure'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build
        run: cargo build --release
