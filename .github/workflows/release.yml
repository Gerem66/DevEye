name: Agent build

# Build the agent and publish the 8-target matrix + a manifest.json to the
# rolling `agent-latest` prerelease. The DevEye server reconciles against this
# release once at boot (see src/agent/sync.ts) — no tag/deploy ordering to
# manage: a push to main builds the agents while Dokploy deploys in parallel,
# and the server picks up the new build on its next boot.
#
# Trigger vs. actual build: the `paths` below keep the workflow off unrelated
# pushes, but `package.json` is noisy (a dependency bump — e.g. @deveye/types —
# edits it without changing anything the agents care about). So the `gate` job
# is the real filter: it only lets the matrix build run when agent/** changed,
# this workflow changed, or package.json's `.version` actually changed — the
# version being what the manifest carries and what installed agents self-update
# on. A dep-only bump therefore no longer burns a full 8-target build.
on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: agent-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cheap guard: decide whether the (expensive) matrix build should actually
  # run, so a push that only touched package.json for a dependency bump doesn't
  # rebuild the agents. Builds when: manual dispatch, agent/** or this workflow
  # changed, or package.json's `.version` changed. Defaults to building on any
  # ambiguity (missing parent ref, force-push) so we never silently skip.
  gate:
    name: should build?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need the push's parent to diff files + read old version

      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Emit the decision and stop (explicit `if` blocks below, not `&&`
          # chains, so `set -e` never mis-fires on a non-matching grep).
          decide() { echo "build=$1" >> "$GITHUB_OUTPUT"; echo "→ $2"; exit 0; }

          # Manual runs always build.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            decide true "manual dispatch"
          fi

          # No usable parent (new branch / force-push): build to stay safe.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            decide true "no parent ref — building"
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            decide true "parent ref unavailable — building"
          fi

          changed="$(git diff --name-only "$BEFORE" "$SHA")"
          echo "Changed files:"; echo "$changed"

          # Agent source or this workflow → always build.
          if echo "$changed" | grep -qE '^agent/|^\.github/workflows/release\.yml$'; then
            decide true "agent/ or workflow changed"
          fi

          # Otherwise only a real version bump counts (a dep-only package.json
          # edit leaves .version identical → skip).
          now="$(jq -r '.version // ""' package.json)"
          was="$(git show "$BEFORE:package.json" 2>/dev/null | jq -r '.version // ""' || echo '')"
          if [ -n "$now" ] && [ "$now" != "$was" ]; then
            decide true "version ${was:-none} → $now"
          fi
          decide false "no agent change and version unchanged (${now:-none}) — skipping"

  build:
    name: agent (${{ matrix.os_label }})
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_label: linux
            builder: zigbuild
            targets: >-
              x86_64-unknown-linux-musl:deveye-agent-linux-x86_64
              aarch64-unknown-linux-musl:deveye-agent-linux-aarch64
              armv7-unknown-linux-musleabihf:deveye-agent-linux-armv7
          - os: macos-latest
            os_label: macos
            builder: cargo
            targets: >-
              x86_64-apple-darwin:deveye-agent-macos-x86_64
              aarch64-apple-darwin:deveye-agent-macos-arm64
          - os: windows-latest
            os_label: windows
            builder: cargo
            targets: >-
              x86_64-pc-windows-msvc:deveye-agent-windows-x86_64.exe
              i686-pc-windows-msvc:deveye-agent-windows-x86.exe
              aarch64-pc-windows-msvc:deveye-agent-windows-arm64.exe
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v6

      # `dtolnay/rust-toolchain` appelle `rustup`, qui télécharge depuis
      # static.rust-lang.org SANS aucun réessai : un « Connection reset by peer »
      # d'une seconde suffit à faire échouer tout le job, alors que rien n'est
      # cassé. Le réessai est ici, autour de l'action elle-même.
      - name: Install Rust toolchain
        id: rust
        continue-on-error: true
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Rust toolchain (2e tentative)
        id: rust-retry
        if: steps.rust.outcome == 'failure'
        continue-on-error: true
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Rust toolchain (dernière tentative)
        if: steps.rust.outcome == 'failure' && steps.rust-retry.outcome == 'failure'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      # Linux musl cross-builds via cargo-zigbuild (Zig as the cross-linker) —
      # robust across host glibc versions, unlike cross-rs's pinned old images.
      # Zig comes from PyPI; cargo-zigbuild picks it up via `python -m ziglang`.
      - name: Install Zig
        if: matrix.builder == 'zigbuild'
        run: python3 -m pip install --break-system-packages ziglang || python3 -m pip install ziglang
      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for pair in ${{ matrix.targets }}; do
            triple="${pair%%:*}"; out="${pair##*:}"
            echo "→ building $triple → $out"
            rustup target add "$triple" || true
            if [ "${{ matrix.builder }}" = "zigbuild" ]; then
              cargo zigbuild --release --target "$triple"
            else
              cargo build --release --target "$triple"
            fi
            case "$out" in
              *.exe) bin="deveye-agent.exe" ;;
              *)     bin="deveye-agent" ;;
            esac
            cp "target/$triple/release/$bin" "dist/$out"
          done
          ls -la dist

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.os_label }}
          path: agent/dist/*
          if-no-files-found: error

  publish:
    name: rolling release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all agent binaries
        uses: actions/download-artifact@v8
        with:
          pattern: agent-*
          path: dist

      # Build the offline signer (gated `signer` feature). Only when the signing
      # key is configured — a fork without the secret still publishes, unsigned
      # (those targets simply can't drive a self-update; manual download is fine).
      - name: Build update signer
        if: ${{ env.AGENT_UPDATE_SIGNING_KEY != '' }}
        env:
          AGENT_UPDATE_SIGNING_KEY: ${{ secrets.AGENT_UPDATE_SIGNING_KEY }}
        working-directory: agent
        run: cargo build --release --features signer --bin deveye-sign

      # Flatten artifacts and generate manifest.json — the contract the server's
      # reconciler diffs against (version + per-target sha256 + size + signature).
      # The signature is an ed25519 signature over the binary's 32 sha256 bytes,
      # which the agent verifies against its embedded public key before updating.
      - name: Stage assets + manifest
        shell: bash
        env:
          AGENT_UPDATE_SIGNING_KEY: ${{ secrets.AGENT_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f -exec cp {} release/ \;

          declare -A IDS=(
            [deveye-agent-linux-x86_64]=linux-x86_64
            [deveye-agent-linux-aarch64]=linux-aarch64
            [deveye-agent-linux-armv7]=linux-armv7
            [deveye-agent-macos-x86_64]=macos-x86_64
            [deveye-agent-macos-arm64]=macos-arm64
            [deveye-agent-windows-x86_64.exe]=windows-x86_64
            [deveye-agent-windows-x86.exe]=windows-x86
            [deveye-agent-windows-arm64.exe]=windows-arm64
          )
          SIGNER=agent/target/release/deveye-sign
          version="$(jq -r .version package.json)"
          targets='[]'
          for f in release/deveye-agent-*; do
            name="$(basename "$f")"
            id="${IDS[$name]:-}"
            [ -z "$id" ] && continue
            sha="$(sha256sum "$f" | awk '{print $1}')"
            size="$(stat -c%s "$f")"
            if [ -n "${AGENT_UPDATE_SIGNING_KEY:-}" ] && [ -x "$SIGNER" ]; then
              sig="$("$SIGNER" sign "$AGENT_UPDATE_SIGNING_KEY" "$sha")"
              targets="$(jq --arg id "$id" --arg fn "$name" --arg sha "$sha" --argjson size "$size" --arg sig "$sig" \
                '. + [{id:$id, filename:$fn, sha256:$sha, size:$size, signature:$sig}]' <<<"$targets")"
            else
              targets="$(jq --arg id "$id" --arg fn "$name" --arg sha "$sha" --argjson size "$size" \
                '. + [{id:$id, filename:$fn, sha256:$sha, size:$size}]' <<<"$targets")"
            fi
          done
          jq -n --arg v "$version" --argjson t "$targets" '{version:$v, targets:$t}' > release/manifest.json
          # Don't print the manifest with signatures into public logs unnecessarily;
          # just confirm it parses and report which targets got signed.
          jq '.targets | map({id, signed: (has("signature"))})' release/manifest.json
          ls -la release

      # Rolling prerelease: stable tag, assets overwritten each build. Kept out of
      # "Latest" (prerelease) so it doesn't shadow the human release flow; the
      # server fetches it by tag name, not via /releases/latest.
      - name: Publish rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: agent-latest
          name: Agent (rolling)
          prerelease: true
          make_latest: 'false'
          files: release/*
          fail_on_unmatched_files: true
