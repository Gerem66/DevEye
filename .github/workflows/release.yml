name: Agent build

# Build the agent on every push to main that touches it (or bumps the DevEye
# version), and publish the 8-target matrix + a manifest.json to the rolling
# `agent-latest` prerelease. The DevEye server reconciles against this release
# once at boot (see src/agent/sync.ts) — there is no tag/deploy ordering to
# manage: a push to main builds the agents while Dokploy deploys in parallel,
# and the server picks up the new build on its next boot.
on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: agent-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: agent (${{ matrix.os_label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_label: linux
            builder: zigbuild
            targets: >-
              x86_64-unknown-linux-musl:deveye-agent-linux-x86_64
              aarch64-unknown-linux-musl:deveye-agent-linux-aarch64
              armv7-unknown-linux-musleabihf:deveye-agent-linux-armv7
          - os: macos-latest
            os_label: macos
            builder: cargo
            targets: >-
              x86_64-apple-darwin:deveye-agent-macos-x86_64
              aarch64-apple-darwin:deveye-agent-macos-arm64
          - os: windows-latest
            os_label: windows
            builder: cargo
            targets: >-
              x86_64-pc-windows-msvc:deveye-agent-windows-x86_64.exe
              i686-pc-windows-msvc:deveye-agent-windows-x86.exe
              aarch64-pc-windows-msvc:deveye-agent-windows-arm64.exe
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      # Linux musl cross-builds via cargo-zigbuild (Zig as the cross-linker) —
      # robust across host glibc versions, unlike cross-rs's pinned old images.
      # Zig comes from PyPI; cargo-zigbuild picks it up via `python -m ziglang`.
      - name: Install Zig
        if: matrix.builder == 'zigbuild'
        run: python3 -m pip install --break-system-packages ziglang || python3 -m pip install ziglang
      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for pair in ${{ matrix.targets }}; do
            triple="${pair%%:*}"; out="${pair##*:}"
            echo "→ building $triple → $out"
            rustup target add "$triple" || true
            if [ "${{ matrix.builder }}" = "zigbuild" ]; then
              cargo zigbuild --release --target "$triple"
            else
              cargo build --release --target "$triple"
            fi
            case "$out" in
              *.exe) bin="deveye-agent.exe" ;;
              *)     bin="deveye-agent" ;;
            esac
            cp "target/$triple/release/$bin" "dist/$out"
          done
          ls -la dist

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.os_label }}
          path: agent/dist/*
          if-no-files-found: error

  publish:
    name: rolling release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all agent binaries
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: dist

      # Flatten artifacts and generate manifest.json — the contract the server's
      # reconciler diffs against (version + per-target sha256 + size).
      - name: Stage assets + manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f -exec cp {} release/ \;

          declare -A IDS=(
            [deveye-agent-linux-x86_64]=linux-x86_64
            [deveye-agent-linux-aarch64]=linux-aarch64
            [deveye-agent-linux-armv7]=linux-armv7
            [deveye-agent-macos-x86_64]=macos-x86_64
            [deveye-agent-macos-arm64]=macos-arm64
            [deveye-agent-windows-x86_64.exe]=windows-x86_64
            [deveye-agent-windows-x86.exe]=windows-x86
            [deveye-agent-windows-arm64.exe]=windows-arm64
          )
          version="$(jq -r .version package.json)"
          targets='[]'
          for f in release/deveye-agent-*; do
            name="$(basename "$f")"
            id="${IDS[$name]:-}"
            [ -z "$id" ] && continue
            sha="$(sha256sum "$f" | awk '{print $1}')"
            size="$(stat -c%s "$f")"
            targets="$(jq --arg id "$id" --arg fn "$name" --arg sha "$sha" --argjson size "$size" \
              '. + [{id:$id, filename:$fn, sha256:$sha, size:$size}]' <<<"$targets")"
          done
          jq -n --arg v "$version" --argjson t "$targets" '{version:$v, targets:$t}' > release/manifest.json
          echo "manifest:"; cat release/manifest.json
          ls -la release

      # Rolling prerelease: stable tag, assets overwritten each build. Kept out of
      # "Latest" (prerelease) so it doesn't shadow the human release flow; the
      # server fetches it by tag name, not via /releases/latest.
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: Agent (rolling)
          prerelease: true
          make_latest: 'false'
          files: release/*
          fail_on_unmatched_files: true
