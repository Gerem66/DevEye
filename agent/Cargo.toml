[package]
name = "deveye-agent"
# Fallback only — the real reported version is injected at build time from the
# root DevEye/package.json (single source of truth, see build.rs / DEVEYE_VERSION).
version = "0.0.0"
edition = "2021"
description = "DevEye Agent — lightweight cross-platform monitoring daemon (Linux, macOS, Windows)"
license = "AGPL-3.0-only"
# `deveye-sign` is a gated helper bin; keep `cargo run`/release defaulting to the agent.
default-run = "deveye-agent"

[[bin]]
name = "deveye-agent"
path = "src/main.rs"

# Offline signing helper (keygen + sign), used by the CI release to sign each
# binary's sha256 with the update-signing key, and locally to bootstrap the key.
# Gated behind the `signer` feature so the cross-compiled agent builds never pull
# it in (a normal `cargo build --release` skips it).
[[bin]]
name = "deveye-sign"
path = "src/sign.rs"
required-features = ["signer"]

[features]
signer = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "process", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# raw_value: a signed order is verified over the exact payload bytes received.
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
sysinfo = "0.32"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
# CloudSync end-to-end encrypted shares: AES-256-GCM, HKDF and HMAC from ring,
# X25519 from curve25519-dalek. Both are already built for rustls and
# ed25519-dalek: no new code in the binary, only direct access to it.
ring = "0.17"
curve25519-dalek = "4"
# Advanced log/file search (reuses regex-automata/regex-syntax already pulled in by
# tracing-subscriber's env-filter, so the marginal binary cost stays small).
regex = "1"
# Cross-platform pseudo-terminal for the remote terminal feature (openpty on Unix,
# ConPTY on Windows).
portable-pty = "0.9"
# Downloading a directory from the file explorer: it is streamed as a `.tar.gz`
# built on the fly. `flate2`'s default backend is miniz_oxide (pure Rust), so the
# musl cross-builds keep working without a C toolchain.
tar = "0.4"
flate2 = "1"
# CloudSync: cross-platform filesystem watcher (inotify/FSEvents/ReadDirectoryChangesW),
# mtime application on installed files, and NFC path normalisation (macOS emits NFD).
notify = "8"
filetime = "0.2"
unicode-normalization = "0.1"

# Reprise du propriétaire de ce que l'agent pose sur le disque (téléversements
# de l'explorateur, installations CloudSync). Il tourne souvent en root (service
# système) : sans `chown`, tout fichier qu'il crée appartient à root, et
# l'utilisateur ne peut plus ni le modifier ni le supprimer chez lui.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Notification-area icon (`deveye-agent tray`). Linux speaks StatusNotifierItem
# over D-Bus in pure Rust: GTK/appindicator would not link into the static musl
# builds. `zbus` (already under `ksni`) also sends the desktop notifications.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }

# The icon's event loop, which `tray-icon` leaves to the application.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSString"] }

# The icon's message loop, the status published in the registry, the UI language.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

# Used by build.rs to read the version out of the root package.json.
[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
