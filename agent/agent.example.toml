# Example DevEye agent configuration.
#
# The agent normally writes this file itself during `deveye-agent link`.
# Location: $DEVEYE_CONFIG, or <config-dir>/deveye/agent.toml
#   - Linux: ~/.config/deveye/agent.toml
#   - macOS: ~/Library/Application Support/deveye/agent.toml
#   - Windows: %APPDATA%\deveye\agent.toml
#
# It is read once, at start: edit it, then restart the agent (for [policy],
# `deveye-agent policy` does both). A token the server rotates is written into
# the file as it is on disk, so an edit made while the agent runs stays.

# HTTP base URL of the DevEye server. Plain http:// is refused for anything but
# this machine, unless `allow_plaintext` is set (link with --insecure-plaintext).
server = "https://deveye.example.com"

# Human-friendly device name (shown in the Appareils page).
name = "my-laptop"

# Stable machine fingerprint (auto-derived: machine-id on Linux,
# IOPlatformUUID on macOS, MachineGuid on Windows; `random-...` when linked
# with --shuffle-id).
fingerprint = "0123456789abcdef0123456789abcdef"

# Set automatically by `deveye-agent link <code>`:
# device_id = "..."
# device_token = "..."      # replaced by the server before it expires
# order_key = "..."         # the server's order-signing key; without it, every
#                           # order listed under [policy] is refused

# allow_plaintext = false

# Where this machine accepts a CloudSync share. Empty: any directory that is not
# a system one (/etc, /usr, /var/lib, ...). Listed: only these directories and
# what is under them, system ones included if you name them. The server picks a
# share's folder; this list is what it cannot pick outside of.
sync_roots = []

# Hosts beyond this machine that a tunnel may reach (a database on the LAN), as
# names or IP addresses. Empty: this machine's loopback only, so a linked machine
# is not a door into its network. A name is resolved once; every address it
# resolves to must be loopback or listed here, or the tunnel is refused whole.
tunnel_targets = []

# What the server may order on this machine. The server cannot change this
# section. Set a key to false for monitoring without that kind of remote control;
# the matching buttons are greyed out in DevEye. `link --deny` and
# `deveye-agent policy` write it too.
[policy]
allow_terminal = true          # an interactive shell
allow_files_read = true        # browse, search, download, archive files
allow_files_write = true       # delete, rename, create, upload
allow_power = true             # shut down, reboot, suspend, lock
allow_pkg_upgrade = true       # system package upgrades
allow_service_elevate = true   # asking the desktop to make the agent a root service
allow_destroy = true           # wiping the agent when the device is deleted in DevEye
allow_docker = true            # every container action (the inventory stays readable)
allow_docker_deploy = true     # deployments: pull a compose service's image and recreate it
allow_sync = true              # CloudSync shares: the server reading and writing a synced folder
allow_tunnel = true            # tunnels: a module reaching a service of this machine (a database on
                               # its loopback, or a host of `tunnel_targets`)
