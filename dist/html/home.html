<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Oxy Gestion</title>
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="author" content="Geremy">
		<meta name="description" content="Oxy Foo">
        <meta name="robots" content="noindex">
        <meta name="googlebot" content="noindex">

        <!-- Icon    --><link rel="icon" href="dist/img/Oxy.png">
        <!-- Style   --><link rel="stylesheet" href="dist/css/home.css">
        <!-- Icons   --><link rel="stylesheet" href="dist/css/icons.css">
        <!-- Fonts   --><link rel="stylesheet" href="dist/css/fonts.css">

        <!-- Comp.   --><link rel="stylesheet" href="dist/css/components.css">

        <!-- Utils   --><script src="dist/js/utils.js"></script>

        <!-- Script  --><script src="dist/js/home.js"></script>

    <body>

        <nav class="homebar">
            <a href="./home">
                <img src="dist/img/Oxy.png" alt="Oxy logo" />

            </a>
        </nav>

        <nav class="topbar">
            <a><i class="icon icon-menu"></i></a>
        </nav>

        <nav class="sidebar">
            <div class="user-panel" name="sidebar-item" data-page="user">

                    <img src="dist/img/%avatar%" alt="User Image">
                    <span class="d-block a">%username%</span>
                </a>
            </div>
            <ul>%sidebar%</ul>
        </nav>

        <nav id="main-content"></nav>
