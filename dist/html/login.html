<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>DevEye - Connexion</title>
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Geremy">
        <meta name="description" content="DevEye">
        <meta name="robots" content="noindex">
        <meta name="googlebot" content="noindex">

        <link rel="preload" href="assets/fonts/open-sans/OpenSans-Light.ttf" as="font" type="font/ttf" crossorigin>
        <link rel="preload" href="assets/fonts/open-sans/OpenSans-SemiBold.ttf" as="font" type="font/ttf" crossorigin>

        <!-- Icon   --><link rel="icon" href="assets/img/logo_deveye.png">
        <!-- Style  --><link rel="stylesheet" href="dist/css/login.css">
        <!-- Icons  --><link rel="stylesheet" href="dist/css/icons.css">
        <!-- Fonts  --><link rel="stylesheet" href="dist/css/fonts.css">
        <!-- Inputs --><link rel="stylesheet" href="dist/css/inputs.css">
        <!-- Utils  --><script src="dist/js/utils/functions.js"></script>
        <!-- Script --><script src="dist/js/login.js"></script>
    </head>

    <body>
        <div id="login-form" class="form hide">
            <span class="title"><b>Dev</b> <p class="anim">Eye</p></span>
            <form class="card" action="./home" method="post">
                <!--p class="login-box-msg">Phrase ?</p-->
                <div class="input-group">
                    <input type="text" class="form-input %error%" placeholder="Nom d'utilisateur" name="tb_name" required>
                    <span class="icon icon-user"></span>
                </div>
                <div class="input-group">
                    <input type="password" class="form-input %error%" placeholder="Mot de passe" name="tb_pass" required>
                    <span class="icon icon-lock"></span>
                </div>
                <button type="submit" class="submit" name="bt_connect">Se connecter</button>
            </form>
        </div>
    </body>
</html>
