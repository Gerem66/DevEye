# DevEye — development stack.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Brings up an EMPTY but PERSISTENT MySQL database (named volume) plus the app.
# On first boot the app runs migrations and seeds a development account
# (SEED_DEV=true). No real data is imported. The app serves the built web client
# and the API on the same origin: http://localhost:3000
#
# For a hot-reload workflow instead, run the app on the host with `npm run dev`
# (Vite on :5173 proxies /api and /ws to the server on :3000).

name: deveye-dev

services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${DB_DATABASE:-DevEye}
      MYSQL_USER: ${DB_USERNAME:-deveye}
      MYSQL_PASSWORD: ${DB_PASSWORD:-deveye}
    ports:
      # Exposed on 5001 to avoid clashing with a host MySQL on 5000.
      - '${DB_PORT_HOST:-5001}:3306'
    volumes:
      - deveye_dev_db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD:-devroot}']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      # Docker-specific overrides: DB is the 'db' service, not localhost.
      DB_HOSTNAME: db
      DB_PORT: '3306'
      SEED_DEV: 'true'
    ports:
      - '${LISTEN_PORT:-3000}:${LISTEN_PORT:-3000}'

volumes:
  deveye_dev_db:
