# La base du développement : un MySQL vide et persistant, pour `npm run dev`.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Dans `.env` : DB_HOSTNAME=localhost, DB_PORT=5001, et les identifiants ci-dessous.

name: deveye-dev

services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${DB_DATABASE:-DevEye}
      MYSQL_USER: ${DB_USERNAME:-deveye}
      MYSQL_PASSWORD: ${DB_PASSWORD:-deveye}
    ports:
      # 5001, pour ne pas heurter un MySQL de l'hôte.
      - '${DB_PORT_HOST:-5001}:3306'
    volumes:
      - deveye_dev_db:/var/lib/mysql

volumes:
  deveye_dev_db:
