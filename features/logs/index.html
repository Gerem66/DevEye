<div class="f-logs">
    <div class="row">
        <div class="col-half">
            <h1 class="feature-title">Logs</h1>
        </div>
        <div class="col-half">
            <ul id="breadcrumb" class="breadcrumb row float-right">
                <li><a data-page="user">%username%</a></li>
                <li>Logs</li>
            </ul>
        </div>
    </div>

    <div class="row">
        <div class="card col-full logs" data-title="Logs">
            <table data-maxpage="%maxpage%">
                <thead>
                    <tr>
                        <th style="width: 5%; min-width: 48px;">ID</th>
                        <th style="width: 5%;">ID Utilisateur</th>
                        <th style="width: 10%; min-width: 350px;">IP</th>
                        <th style="width: 5%;">Type</th>
                        <th style="width: 60%;">Descritption</th>
                        <th style="width: 20%; min-width: 200px;">Date</th>
                    </tr>
                </thead>
                <tbody>
                    %logsContent%
                </tbody>
            </table>
        </div>
    </div>
</div>
