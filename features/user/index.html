<!-- Main -->
<div class="row">
    <div class="col-half">
        <h1 class="feature-title">Mon espace</h1>
    </div>
    <div class="col-half">
        <ul id="breadcrumb" class="breadcrumb row float-right">
            <li>%username%</li>
        </ul>
    </div>
</div>

<div class="row">
    <div class="card col-third responsive" data-title="Profil">
        <div class="profile-header">
            <img src="assets/img/%avatar%" alt="User profile picture">
            <h2>%username%</h2>%status%
        </div>

        <div class="profile-body">
            <ul>
                <li>
                    <b>Nombre d'Instances</b>
                    <p class="float-right">%instance%</p>
                </li>
                <li>
                    <b>Adresse Email</b>
                    <p class="float-right">%email%</p>
                </li>
                <li>
                    <b>Mot de passe</b>
                    <a class="float-right">Modifier le mot de passe</a>
                </li>
                <li>
                    <b>Double authentification</b>
                    <p class="float-right tfa">%2fa%</p>
                </li>
                <li>
                    <b>Date de création du compte</b>
                    <p class="float-right">%date%</p>
                </li>
            </ul>
            <form action="./" method="POST">
                <button type="submit" name="disconnect" class="btn btn-block"><b>Se déconnecter</b></button>
            </form>
        </div>
    </div>

    <div class="card col-third responsive" data-title="Paramètres">
        <h2 class="settings-title">Fonctionnalités</h2>
        <ul id="settings-features" class="settings-features">
            %features%
        </ul>
        <h2 class="settings-title">Page par défaut</h2>
        <select id="settings-default" class="settings">
            <option value="user">Mon espace</option>
            %options%
        </select>
        <button id="save-settings" class="btn btn-block disabled"><b>Sauvegarder</b></button>
    </div>
</div>
