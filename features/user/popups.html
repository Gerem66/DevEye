<popup id="popup-password">
    <div class="card col-quarter responsive" data-title="Changer le mot de passe">

        <p>
            Il n'y a aucune limitation, donc soit sûr de la sécurité de ton mot de passe
            <br><br>
            Conseillé : 12 caractères minimum, avec des minuscules, des majuscules, des chiffres et des caractères spéciaux
        </p>
        <div class="form-group">
            <input name="input-pwd-old" class="form-input" type="password" placeholder="Ancien mot de passe">
            <button name="toggle" class="btn" data-input="input-pwd-old">
                <i class="icon icon-eye-close"></i>
            </button>
        </div>

        <div class="form-group">
            <input name="input-pwd-new" class="form-input" type="password" placeholder="Nouveau mot de passe">
            <button name="toggle" class="btn" data-input="input-pwd-new">
                <i class="icon icon-eye-close"></i>
            </button>
        </div>

        <div class="form-group float-center">
            <button name="btn-back" class="btn">Retour</button>
            <button name="btn-save" class="btn">Enregistrer</button>
        </div>

    </div>
</popup>

<popup id="popup-message">
    <div class="card col-quarter responsive" data-title="Mot de passe">
        <p name="main-text"></p>
        <div class="form-group float-center">
            <button name="btn-back" class="btn">Continuer</button>
        </div>
    </div>
</popup>
