<popup id="popup-mail">
    <div class="card col-quarter responsive" data-title="Ajouter une boîte mail">

        <div class="form-group">
            <input name="input-name" class="form-input" placeholder="Nom de la boîte mail">
        </div>

        <div class="form-group">
            <input name="input-address" class="form-input" placeholder="Adresse e-mail">
        </div>

        <div class="form-group">
            <input name="input-server" class="form-input" type="text" placeholder="Serveur">
        </div>

        <div class="form-group">
            <input name="input-password" class="form-input" type="password" placeholder="Mot de passe">
            <button name="toggle" class="btn" data-input="input-password">
                <i class="icon icon-eye-close"></i>
            </button>
        </div>

        <div class="form-group float-center">
            <button name="btn-back" class="btn">Retour</button>
            <button name="btn-save" class="btn">Ajouter</button>
        </div>

    </div>
</popup>

<popup id="popup-message">
    <div class="card col-quarter responsive" data-title="Message">
        <p name="main-text"></p>
        <div class="form-group float-center">
            <button name="btn-back" class="btn">Continuer</button>
        </div>
    </div>
</popup>

<popup id="popup-mail-content">
    <div class="card col-two-thirds responsive" data-title="Mail">
        <button name="mail-close" class="icon icon-x"></button>
        <button name="mail-get-header" class="icon icon-details"></button>
        <iframe name="mail-content" class="popup-mail-content">
        </iframe>
    </div>
</popup>

<popup id="popup-mail-header">
    <div class="card col-half responsive" data-title="Header">
        <p name="main-text"></p>
    </div>
</popup>
