<div id="popup-message" class="popup">
    <div class="card col-quarter responsive" data-title="Message">
        <p name="main-text"></p>
        <div class="form-group float-center">
            <button name="btn-back" class="btn">Continuer</button>
        </div>
    </div>
</div>

<div id="popup-delete" class="popup">
    <div class="card col-quarter responsive" data-title="Supprimer ?">
        <p>Es-tu sûr(e) de vouloir supprimer cette note ?</p>
        <div class="form-group float-center">
            <button class="btn" name="btn-back">Retour</button>
            <button class="btn" name="btn-delete">Supprimer</button>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-half">
        <h1 class="feature-title">Notes</h1>
    </div>
    <div class="col-half">
        <ul id="breadcrumb" class="breadcrumb row float-right">
            <li><a data-page="user">%username%</a></li>
            <li>Notes</li>
        </ul>
    </div>
</div>

<div class="row row-notes">
    <div class="card card-notes" data-title="Liste des notes">
        <div class="card-header">
            <i id="btn-notes-add" class="icon icon-add"></i>
        </div>
        <ul id="notes-list" class="notes-list">
            %notes%
        </ul>
    </div>

    <div id="note-container" class="card card-note">
        <div class="card-header">
            Note créée le : <p id="note-date">%date%</p><br>
            Dernière modification : <p id="note-date-last">%date%</p>
        </div>
        <div id="note-header">
            <p id="note-title">[Titre]</p>
            <i id="btn-edit" class="icon icon-edit" title="Modifier la note"></i>
            <i id="btn-delete" class="icon icon-trash" title="Supprimer la note"></i>
        </div>
        <div id="note-content" class="markdown">
            %note%
        </div>
    </div>
</div>
