<div class="row">
    <div class="col-half">
        <h1 class="feature-title">Sandbox</h1>
    </div>
    <div class="col-half">
        <ul id="breadcrumb" class="breadcrumb row float-right">
            <li><a data-page="user">%username%</a></li>
            <li>Sandbox</li>
        </ul>
    </div>
</div>

<div class="row">
    <div class="card col-half responsive card-sandbox" data-title="PHP Sandbox">
        <textarea id="input-php-sandbox" class="form-input" type="text" placeholder="Enter your code here..." spellcheck="false"></textarea>
        <button id="btn-php-sandbox" class="btn">Run<i class="icon icon-chevron"></i></button>
    </div>
    <div class="card col-third responsive card-sandbox-result" data-title="Result">
        <div id="header-text" class="card-header message"></div>
        <textarea id="output-php-sandbox" class="form-input" readonly></textarea>
    </div>
</div>
