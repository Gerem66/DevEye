<popup id="popup-password">
    <div class="card col-quarter responsive" data-title="Ajouter un mot de passe">

        <p>
            Stocker un mot de passe est une bonne pratique pour protéger vos compte.
            <br>
            Les informations concernant les mots de passe sont chiffrées.
        </p>

        <input name="input-category" list="category" class="form-input" placeholder="Catégorie">
        <datalist id="category">%categories%</datalist>

        <div class="form-group">
            <input name="input-service" class="form-input" type="text" placeholder="Service">
        </div>

        <div class="form-group">
            <input name="input-username" class="form-input" type="text" placeholder="Nom d'utilisateur / Email">
        </div>

        <div class="form-group">
            <input name="input-password" class="form-input" type="password" placeholder="Mot de passe">
            <button name="toggle" class="btn" data-input="input-password">
                <i class="icon icon-eye-close"></i>
            </button>
        </div>

        <select name="input-status" class="select-grey">
            <option value="enable">Actif</option>
            <option value="disable">Inactif</option>
            <option value="none">Indéterminé</option>
        </select> 

        <div class="form-group float-center">
            <button name="btn-back" class="btn">Retour</button>
            <button name="btn-save" class="btn">Ajouter</button>
        </div>

    </div>
</popup>

<popup id="popup-message">
    <div class="card col-quarter responsive" data-title="Mot de passe">
        <p name="main-text"></p>
        <div class="form-group float-center">
            <button name="btn-back" class="btn">Continuer</button>
        </div>
    </div>
</popup>

<popup id="popup-verify">
    <div class="card col-quarter responsive" data-title="Mot de passe">

        <div class="form-group">
            <input name="input-password" class="form-input" type="password" placeholder="Mot de passe">
            <button name="toggle" class="btn" data-input="input-password">
                <i class="icon icon-eye-close"></i>
            </button>
        </div>

        <div class="form-group float-center">
            <button name="btn-back" class="btn">Retour</button>
            <button name="btn-unlock" class="btn">Déverrouiller</button>
        </div>
    </div>
</popup>

<popup id="popup-edit-category">
    <div class="card col-quarter responsive" data-title="Changer de nom">

        <p>Nom de la catégorie à modifier :</p>
        <div class="form-group">
            <input name="input-category-old" class="form-input" type="text" readonly>
        </div>

        <p>Nouveau nom :</p>
        <div class="form-group">
            <input name="input-category-new" class="form-input" type="text" placeholder="Nouveau nom">
        </div>

        <div class="form-group float-center">
            <button name="btn-back" class="btn">Retour</button>
            <button name="btn-edit" class="btn">Modifier</button>
        </div>
    </div>
</popup>

<popup id="popup-move-password">
    <div class="card col-quarter responsive" data-title="Modifier la catégorie du mot de passe">
        <p>Nouvelle catégorie</p>
        <div class="form-group">
            <input name="input-category" list="category" class="form-input" placeholder="Catégorie">
            <datalist id="category">%categories%</datalist>
        </div>

        <div class="form-group float-center">
            <button name="btn-back" class="btn">Retour</button>
            <button name="btn-move" class="btn">Modifier</button>
        </div>
    </div>
</popup>

<popup id="popup-remove">
    <div class="card col-quarter responsive" data-title="Confirmation de la suppression">

        <div class="form-group">
            <input name="input-password" class="form-input" type="password" placeholder="Mot de passe">
            <button name="toggle" class="btn" data-input="input-password">
                <i class="icon icon-eye-close"></i>
            </button>
        </div>

        <div class="form-group float-center">
            <button name="btn-back" class="btn">Retour</button>
            <button name="btn-remove" class="btn">Supprimer</button>
        </div>
    </div>
</popup>
