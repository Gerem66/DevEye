<div id="popup-password" class="popup">
    <div class="card col-quarter responsive" data-title="Ajouter un mot de passe">

        <p>
            Stocker un mot de passe est une bonne pratique pour protéger vos compte.
            <br>
            Les informations concernant les mots de passe sont chiffrées.
        </p>

        <input id="input-category" list="category" class="form-input" placeholder="Catégorie">
        <datalist id="category">%categories%</datalist>

        <div class="form-group">
            <input id="input-service" class="form-input" type="text" placeholder="Service">
        </div>

        <div class="form-group">
            <input id="input-username" class="form-input" type="text" placeholder="Nom d'utilisateur / Email">
        </div>

        <div class="form-group">
            <input id="input-password" class="form-input" type="password" placeholder="Mot de passe">
            <button name="btn-toggle-pwd" class="btn">
                <i class="icon icon-eye-close"></i>
            </button>
        </div>

        <select id="input-status">
            <option value="enable">Actif</option>
            <option value="disable">Inactif</option>
            <option value="none">Indéterminé</option>
        </select> 

        <div class="form-group float-center">
            <button name="btn-back" class="btn">Retour</button>
            <button name="btn-save" class="btn">Ajouter</button>
        </div>

    </div>
</div>

<div id="popup-message" class="popup">
    <div class="card col-quarter responsive" data-title="Mot de passe">
        <p></p>
        <div class="form-group float-center">
            <button name="btn-back" class="btn">Continuer</button>
        </div>
    </div>
</div>

<div id="popup-verify" class="popup">
    <div class="card col-quarter responsive" data-title="Mot de passe">

        <div class="form-group">
            <input id="input-password" class="form-input" type="password" placeholder="Mot de passe">
            <button name="btn-toggle-pwd" class="btn">
                <i class="icon icon-eye-close"></i>
            </button>
        </div>

        <div class="form-group float-center">
            <button name="btn-back" class="btn">Retour</button>
            <button name="btn-unlock" class="btn">Déverrouiller</button>
        </div>
    </div>
</div>

<div id="popup-edit-category" class="popup">
    <div class="card col-quarter responsive" data-title="Changer de nom">

        <p>Nom de la catégorie à modifier :</p>
        <div class="form-group">
            <input id="input-category-old" class="form-input" type="text" readonly>
        </div>

        <p>Nouveau nom :</p>
        <div class="form-group">
            <input id="input-category-new" class="form-input" type="text" placeholder="Nouveau nom">
        </div>

        <div class="form-group float-center">
            <button name="btn-back" class="btn">Retour</button>
            <button name="btn-edit" class="btn">Modifier</button>
        </div>
    </div>
</div>
