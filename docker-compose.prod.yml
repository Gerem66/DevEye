# DevEye — production stack.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up --build -d
#
# The app serves the built web client and the API on the same origin
# (HTTP_PORT, default 8081). MySQL runs in an internal-only container (no host
# port published) with a persistent named volume. Provide real secrets via a
# `.env.prod` file (copy `.env.prod.template`) passed with `--env-file`.

name: deveye-prod

services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - deveye_prod_db:/var/lib/mysql
    # No `ports:` — the database is only reachable on the internal network.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: DevEye/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: prod
      HTTP_PORT: "8081"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PATH: ./logs
      DB_HOSTNAME: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      CRYPT_KEY_A: ${CRYPT_KEY_A:?set CRYPT_KEY_A}
      CRYPT_KEY_B: ${CRYPT_KEY_B:?set CRYPT_KEY_B}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-200}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
    ports:
      - "${HTTP_PORT_HOST:-8081}:8081"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8081/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  deveye_prod_db:
