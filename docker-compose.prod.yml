# DevEye — production stack.
#
#   cp .env.template .env
#   docker compose -f docker-compose.prod.yml up --build -d
#
# The app is intentionally NOT exposed to the internet: it binds to
# 127.0.0.1 only (localhost). Access it via SSH tunnel or from the host
# directly. The DB is an external MySQL instance.

name: deveye-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GITHUB_PACKAGES_TOKEN: ${GITHUB_PACKAGES_TOKEN:?set GITHUB_PACKAGES_TOKEN}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - '127.0.0.1:${LISTEN_PORT:-3000}:${LISTEN_PORT:-3000}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:${LISTEN_PORT:-3000}/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      default:
      dokploy-network:
        aliases:
          - deveye-server

networks:
  dokploy-network:
    external: true
