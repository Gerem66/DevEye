# DevEye — production stack.
#
#   cp .env.template .env
#   docker compose -f docker-compose.prod.yml up --build -d
#
# The app is intentionally NOT exposed to the internet: it binds to
# 127.0.0.1 only (localhost). Access it via SSH tunnel or from the host
# directly. The DB is an external MySQL instance.
#
# ## La surface publique, quand elle est activée
#
# Régler `PUBLIC_LISTEN_PORT` dans `.env` démarre un **second écouteur** dans le
# même processus, qui ne déclare que l'ingestion d'audience et son script : ni
# authentification, ni WebSocket, ni client web n'y existent (voir
# `src/publicApp.ts`). On lui dédie alors un domaine, et la séparation ne dépend
# d'aucune règle de routage.
#
# Rien à ajouter ici pour cela : le conteneur est déjà sur `dokploy-network`
# sous l'alias `deveye-server`, et Traefik l'y atteint sur n'importe quel port.
# Dans Dokploy, ajouter un domaine à cette application en indiquant ce port-là
# comme port de destination, puis accorder `AUDIENCE_ORIGIN` avec ce domaine.
#
# Le bloc `ports:` ci-dessous n'expose volontairement **que** le port privé sur
# la boucle locale : il sert au dépannage depuis l'hôte, pas au routage.

name: deveye-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GITHUB_PACKAGES_TOKEN: ${GITHUB_PACKAGES_TOKEN:?set GITHUB_PACKAGES_TOKEN}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Agent binaries live here, synced once at boot from the rolling release
    # (AGENT_DOWNLOAD_TOKEN / AGENT_RELEASE_TAG in .env). A named volume so the
    # sync survives redeploys — only a genuinely new build is re-downloaded.
    # Le stockage CloudSync est un chemin DU SERVEUR, donc du conteneur. Sans ce
    # montage, un partage vivrait sur la couche d'écriture du conteneur :
    # invisible depuis l'hôte, et effacé au prochain redéploiement.
    #
    # `CLOUDSYNC_STORAGE_ROOT` est le chemin **hôte** (source), `/data/cloudsync`
    # le chemin **conteneur** (cible, et valeur par défaut de
    # `CLOUDSYNC_STORAGE_DIR` que lit le serveur). Deux variables parce que ce
    # sont deux chemins : les confondre revient à écrire dans le conteneur.
    volumes:
      - agent-bin:/app/DevEye/agent/dist
      - ${CLOUDSYNC_STORAGE_ROOT:-./cloudsync-data}:/data/cloudsync
      # Les sauvegardes locales, même logique de paire hôte/conteneur. Sans ce
      # montage, une archive écrite par un travail « Dossier du serveur »
      # disparaîtrait au redéploiement suivant — c'est-à-dire exactement le jour
      # où on aurait pu en avoir besoin.
      - ${BACKUP_STORAGE_ROOT:-./backup-data}:/data/backups
    ports:
      - '127.0.0.1:${LISTEN_PORT:-3000}:${LISTEN_PORT:-3000}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:${LISTEN_PORT:-3000}/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      default:
      dokploy-network:
        aliases:
          - deveye-server
      oxyfoo-network:

volumes:
  agent-bin:

networks:
  dokploy-network:
    external: true
  oxyfoo-network:
    external: true
