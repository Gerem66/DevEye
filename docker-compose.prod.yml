# DevEye — production stack.
#
#   cp .env.template .env
#   docker compose -f docker-compose.prod.yml up --build -d
#
# The app serves the built web client and the API on the same origin
# (HTTP_PORT, default 3000) and connects to an external MySQL database
# (for example the managed DB from Dockploy). Provide real secrets via a
# `.env` file copied from `.env.template`.

name: deveye-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GITHUB_PACKAGES_TOKEN: ${GITHUB_PACKAGES_TOKEN:?set GITHUB_PACKAGES_TOKEN}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - '${HTTP_PORT_HOST:-3000}:${HTTP_PORT:-3000}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:${HTTP_PORT:-3000}/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
