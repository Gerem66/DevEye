<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>DevEye - Connexion</title>

        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Geremy">
        <meta name="description" content="DevEye">
        <meta name="robots" content="noindex">
        <meta name="googlebot" content="noindex">

        <!-- Icon    --><link rel="icon" href="assets/img/logo_deveye.png">

        <!-- Style   --><link rel="stylesheet" href="dist/css/login.css">
        <!-- Icons   --><link rel="stylesheet" href="dist/css/icons.css">
        <!-- Fonts   --><link rel="stylesheet" href="dist/css/fonts.css">
        <!-- Inputs  --><link rel="stylesheet" href="dist/css/inputs.css">
        <!-- Loading --><link rel="stylesheet" href="dist/css/loading.css">

        <!-- DevEye  --><script src="dist/js/class/deveye.js"></script>
        <!-- Server  --><script src="dist/js/class/wss.js"></script>
        <!-- Main    --><script src="dist/js/class/login.js"></script>
        <!-- Utils   --><script src="dist/js/utils/functions.js"></script>
        <!-- Main    --><script src="dist/js/main.js"></script>
    </head>

    <body>
        <div id="login-content" class="login">
            <div id="login-form" class="form form-hide">
                <span id="title" class="title"><b>Dev</b> <p>Eye</p></span>
                <div class="login-card">
                    <div class="input-group">
                        <input id="tb-username" class="form-input" type="text" placeholder="Nom d'utilisateur" autofocus>
                        <span class="icon icon-user"></span>
                    </div>
                    <div class="input-group">
                        <input id="tb-password" class="form-input" type="password" placeholder="Mot de passe">
                        <span class="icon icon-lock"></span>
                    </div>
                    <button id="bt-connect" class="submit">Se connecter</button>
                </div>
            </div>

            <div id="loading" class="loading form-hide">
                <div class="loading-text">
                    <p id="loading-text"></p>
                    <p id="loading-value"></p>
                </div>
                <div class="loading-bar">
                    <div id="loading-bar" class="loading-bar-fill"></div>
                </div>
            </div>
        </div>
    </body>
</html>
